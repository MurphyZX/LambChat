name: macOS Intel Experiment

# 探索性 workflow（feat/macos-intel-client 分支）：在 arm64 runner 上验证
# x86_64 桌面包的完整构建链路——Rust 交叉编译 + daemon Rosetta 路径 +
# PBS macos-x64 内嵌 + dmg/ad-hoc 签名。只上传 artifact，绝不触碰 Release。
# 结论并入 app-release.yml 后本文件即删除。
on:
  push:
    branches:
      - feat/macos-intel-client

permissions:
  contents: read

jobs:
  macos-intel:
    name: macOS Intel x86_64 (cross-build on arm64)
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add x86_64 Rust target
        run: rustup target add x86_64-apple-darwin

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.32.1'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      # 核心验证点：PyInstaller 不支持交叉编译——build-daemon.sh 的 Rosetta
      # 路径（x86_64 uv + 独立 venv）能否在 arm64 宿主产出真 x86_64 sidecar。
      # 脚本内置 version 冒烟（Rosetta 下执行 x86_64 二进制）。
      - name: Build x86_64 daemon sidecar via Rosetta
        shell: bash
        env:
          DAEMON_TARGET_TRIPLE: x86_64-apple-darwin
          UV_CONCURRENT_DOWNLOADS: '8'
        run: bash client/scripts/build-daemon.sh

      - name: Verify daemon architecture
        shell: bash
        run: |
          set -euo pipefail
          sidecar="frontend/src-tauri/binaries/lambchat-daemon-x86_64-apple-darwin"
          ls -la "$sidecar"
          file "$sidecar"
          archs="$(lipo -archs "$sidecar")"
          echo "lipo -archs: $archs"
          [ "$archs" = "x86_64" ] || { echo "unexpected daemon archs: $archs"; exit 1; }

      - name: Fetch embedded Python runtime (PBS macos-x64)
        shell: bash
        env:
          UV_CONCURRENT_DOWNLOADS: '8'
        run: uv run python client/scripts/fetch-pbs.py --platform macos-x64

      - name: Build x86_64 desktop package
        env:
          TAURI_TARGET: x86_64-apple-darwin
          TAURI_BUNDLES: dmg,app
          CARGO_BUILD_JOBS: 1
        run: pnpm package:desktop
        working-directory: frontend

      - name: Verify app architecture, signing and PBS runtime
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find frontend/src-tauri/target -path '*x86_64-apple-darwin*/release/bundle/macos/*.app' -type d | sort | head -1)"
          if [ -z "$app_path" ]; then
            find frontend/src-tauri/target -name '*.app' -o -name '*.dmg' || true
            echo "No x86_64 .app bundle found"; exit 1
          fi
          echo "app: $app_path"
          # 主程序与嵌套可执行（daemon sidecar）必须全为 x86_64 切片
          find "$app_path/Contents/MacOS" -type f -perm -111 | while read -r bin; do
            archs="$(lipo -archs "$bin")"
            echo "  $(basename "$bin"): $archs"
            [ "$archs" = "x86_64" ] || { echo "unexpected archs in $bin: $archs"; exit 1; }
          done
          # ad-hoc 封印（arm64 内核的强制要求，同生产门禁）
          test -f "$app_path/Contents/_CodeSignature/CodeResources"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          # PBS 运行时按编译期 ARCH 选择 macos-x64 子目录
          test -f "$app_path/Contents/Resources/resources/python/macos-x64/python.tar.gz"
          echo "OK: x86_64 app, ad-hoc sealed, macos-x64 PBS runtime embedded"

      - name: Upload experiment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-experiment
          path: |
            frontend/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            frontend/src-tauri/binaries/lambchat-daemon-x86_64-apple-darwin
          if-no-files-found: error
